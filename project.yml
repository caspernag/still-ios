name: Still

options:
  bundleIdPrefix: com.nagsoftware
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
  generateEmptyDirectories: false

fileGroups:
  - README.md
  - DECISIONS.md
  - HANDOFF.md
  - Still.storekit

packages:
  StillKit:
    path: StillKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_PREVIEWS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Still:
    type: application
    platform: iOS
    sources:
      - path: Still
    info:
      path: Still/Info.plist
      properties:
        CFBundleDisplayName: Still
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nagsoftware.still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still
        PRODUCT_NAME: Still
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    dependencies:
      - package: StillKit
        product: StillKit
      - package: StillKit
        product: DesignSystem
      - target: StillMonitor
      - target: StillShieldConfig
      - target: StillShieldAction
      - target: StillWidgets
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  StillMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: StillMonitor
    info:
      path: StillMonitor/Info.plist
      properties:
        CFBundleDisplayName: Still Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: StillMonitor/StillMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nagsoftware.still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.monitor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StillKit
        product: StillKit
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework

  StillShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: StillShieldConfig
    info:
      path: StillShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Still Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: StillShieldConfig/StillShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nagsoftware.still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.shieldconfig
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StillKit
        product: StillKit
      - package: StillKit
        product: DesignSystem
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  StillShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: StillShieldAction
    info:
      path: StillShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Still Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: StillShieldAction/StillShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nagsoftware.still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.shieldaction
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StillKit
        product: StillKit
      - sdk: ManagedSettings.framework

  StillWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StillWidgets
    info:
      path: StillWidgets/Info.plist
      properties:
        CFBundleDisplayName: Still
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StillWidgets/StillWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nagsoftware.still]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StillKit
        product: StillKit
      - package: StillKit
        product: DesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  StillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StillTests
      - path: Still.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Still
      - package: StillKit
        product: StillKit

  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StillUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nagsoftware.still.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Still
    dependencies:
      - target: Still

schemes:
  Still:
    build:
      targets:
        Still: all
        StillMonitor: all
        StillShieldConfig: all
        StillShieldAction: all
        StillWidgets: all
        StillTests: [test]
        StillUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Still.storekit
      commandLineArguments:
        "-StillDemo": false
        "-StillDemoSkipOnboarding": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Still
      targets:
        - name: StillTests
        - name: StillUITests
        - package: StillKit/StillCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
