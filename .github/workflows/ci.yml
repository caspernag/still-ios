name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['AppStore/screenshots/**', 'Design/review/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: StillCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path StillKit

  ios:
    name: Build and test (Xcode)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          git diff --stat -- Still.xcodeproj || true

      - name: Build for device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Still.xcodeproj -scheme Still \
            -destination 'generic/platform=iOS' -configuration Release \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-release.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" | sort -u

      # StoreKit testing from the xcodebuild CLI is broken on the iOS 26.5 simulator runtime
      # (the .storekit file isn't synced), so tests prefer the iOS 26.2 runtime when present.
      - name: Pick simulator
        id: sim
        run: |
          UDID="$(python3 Scripts/pick_simulator.py "iPhone 1[6-9] Pro$" 26.2)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $UDID"

      - name: Test (unit, StoreKit, UI)
        run: |
          set -o pipefail
          xcodebuild test -project Still.xcodeproj -scheme Still \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:StillUITests/ScreenshotTests \
            -skip-testing:StillUITests/ReviewScreenshotTests \
            -resultBundlePath TestResults.xcresult 2>&1 | tee test.log | grep -E "(error|warning):|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)"

      - name: Test summary
        if: always()
        run: |
          grep -E "Test Case .*failed" test.log || true
          grep -E "Executed [0-9]+ tests" test.log | tail -5 || true
          grep -E "error:" build-release.log | sort -u | head -50 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build-release.log
            test.log
          retention-days: 7

  screenshots:
    name: Screenshots and design review
    needs: ios
    # Runs even if a test failed, so the screenshots stay current; not when the build was cancelled.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen generate

      - name: Boot 6.9-inch simulator
        id: sim
        run: |
          UDID="$(python3 Scripts/pick_simulator.py "iPhone 1[6-9] Pro Max$" 26.2)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Capture
        run: |
          set -o pipefail
          xcodebuild test -project Still.xcodeproj -scheme Still \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:StillUITests/ScreenshotTests \
            -only-testing:StillUITests/ReviewScreenshotTests \
            -resultBundlePath Shots.xcresult 2>&1 | tail -30

      - name: Export and commit
        run: |
          xcrun xcresulttool export attachments --path Shots.xcresult --output-path shots-raw
          rm -rf AppStore/screenshots Design/review
          python3 Scripts/export_attachments.py shots-raw AppStore/screenshots 0
          python3 Scripts/export_attachments.py shots-raw Design/review light- dark- xxl-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots Design/review
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update screenshots [skip ci]"
          git push
